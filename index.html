<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Phish Stats</title>
  <meta name="description" content="Phish show attendance stats — shows, venues, cities/states, and songs — pulled from phish.net." />
  <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
</head>
<body>

  <nav>
    <a class="nav-logo" href="https://ericdferguson.com/" title="ericdferguson.com">ef<span>_</span></a>
    <a href="https://ericdferguson.com/" class="back-link">← Back to site</a>
  </nav>

  <main>
    <section id="hero">
      <h1>Phish Stats</h1>
      <p class="tagline" id="generated-at">Loading…</p>
    </section>

    <section id="overview">
      <h2>Overview</h2>
      <div class="stat-grid" id="stat-grid"></div>
    </section>

    <section id="years">
      <h2>Shows per year</h2>
      <div class="year-chart" id="shows-per-year"></div>
    </section>

    <section id="places">
      <h2>States &amp; provinces visited</h2>
      <ul class="states-list" id="states-list"></ul>
    </section>

    <section id="songs">
      <h2>Most played songs</h2>
      <div class="song-list" id="top-songs"></div>
    </section>
  </main>

  <footer>
    Data via <a href="https://phish.net/api" target="_blank" rel="noopener">phish.net API</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
